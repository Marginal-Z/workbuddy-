<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0e0f0e" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="签到助手" />
<meta name="format-detection" content="telephone=no" />
<meta name="description" content="WorkBuddy 每日签到助手：登录账号，自动完成每天签到，连签不断。" />
<title>签到助手 · WorkBuddy</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<link rel="stylesheet" href="/css/app.css" />
<script>
  // 首屏前应用主题，避免深色模式闪白
  try {
    var s = JSON.parse(localStorage.getItem("wb.settings") || "{}");
    if (s.theme === "dark" || s.theme === "light") document.documentElement.dataset.theme = s.theme;
  } catch (e) {}
</script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="layer"></div>
  <noscript>
    <div class="noscript">请启用 JavaScript 后使用签到助手。</div>
  </noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
